name: CI
on:
  push:
  pull_request:
jobs:
  verify-and-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run appimage
      - name: Smoke launch AppImage
        run: timeout 20s xvfb-run -a "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)" || test $? = 124
      - uses: actions/upload-artifact@v4
        with:
          name: lifelook-unsigned-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
