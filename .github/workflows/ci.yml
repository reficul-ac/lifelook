name: CI
on:
  push:
  pull_request:
jobs:
  verify-and-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb openbox xdotool imagemagick
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run appimage
      - name: Validate AppImage contents
        run: bash scripts/validate-appimage.sh
      - name: Smoke launch visible AppImage window
        run: xvfb-run -a --server-args="-screen 0 1280x820x24" bash scripts/smoke-appimage.sh
      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --locked
      - name: Run native WebDriver accessibility suite
        run: npm run test:e2e:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifelook-native-evidence
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            artifacts/appimage-smoke/*.png
            artifacts/native-e2e/*.png
          if-no-files-found: error
