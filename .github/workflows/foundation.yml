name: Foundation browser and engine

on:
  push:
    paths: ['foundation/**', '.github/workflows/foundation.yml']
  pull_request:
    paths: ['foundation/**', '.github/workflows/foundation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    defaults:
      run:
        working-directory: foundation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: foundation/package-lock.json
      - run: npm ci
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run check
